name: Deploy Railway

on:
  push:
    branches:
      - feat/overnight-product-layer
    paths:
      - ".github/workflows/deploy-railway.yml"
      - "railway.json"
      - "deploy/**"
      - "mcp_server/**"
      - "schemas/**"
      - "telemetry/**"
      - "corpus/jlc/**"
      - "src/skidl/**"
      - "setup.py"
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Railway configuration
        id: railway_config
        run: |
          ready=true
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::Skipping Railway deploy: missing GitHub secret RAILWAY_TOKEN"
            ready=false
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "::notice::Skipping Railway deploy: missing GitHub variable RAILWAY_PROJECT_ID"
            ready=false
          fi
          if [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "::notice::Skipping Railway deploy: missing GitHub variable RAILWAY_SERVICE_ID"
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Install Railway CLI
        if: steps.railway_config.outputs.ready == 'true'
        run: npm install -g @railway/cli@5.12.1

      - name: Deploy
        if: steps.railway_config.outputs.ready == 'true'
        run: |
          railway up \
            --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --message "GitHub ${GITHUB_SHA}"
